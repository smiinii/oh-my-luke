name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.12+8.0.LTS"
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Enable unprivileged user namespaces for bubblewrap tests
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and test
        run: ./gradlew clean build
      - name: Build and verify self-contained app image
        run: ./gradlew verifyPackagedApp
      - name: Verify reproducible package archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find build/package -maxdepth 1 -type f -name 'omluke-*.tar.gz' -print -quit)"
          test -n "$archive"
          python3 scripts/release/verify-reproducible.py "$archive" build/reproducibility
      - name: Preserve reproducibility evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproducibility-${{ runner.os }}-${{ runner.arch }}
          path: build/reproducibility/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Upload verified development package
        uses: actions/upload-artifact@v7
        with:
          name: omluke-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/package/*.tar.gz
            build/package/*.tar.gz.sha256
            build/package/evidence/*.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
