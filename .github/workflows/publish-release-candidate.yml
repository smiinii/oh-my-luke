name: Publish release candidate

run-name: Publish v0.1.0-rc.1 from ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA from main to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-v0.1.0-rc.1
  cancel-in-progress: false

env:
  RC_VERSION: 0.1.0-rc.1
  RELEASE_COMMIT: ${{ inputs.commit_sha }}

jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: aarch64
            machine_arch: arm64
            classifier: macos-aarch64
          - os: ubuntu-24.04
            architecture: x64
            machine_arch: x86_64
            classifier: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
      - name: Verify release input
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          declared_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' build.gradle.kts)"
          test "$declared_version" = "$RC_VERSION"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.12+8.0.LTS"
          architecture: ${{ matrix.architecture }}
      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.machine_arch }}"
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Enable unprivileged user namespaces for bubblewrap tests
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and verify release package
        run: ./gradlew clean build verifyPackagedApp -PreleaseTag="v${RC_VERSION}"
      - name: Verify reproducible archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="build/package/omluke-${RC_VERSION}-${{ matrix.classifier }}.tar.gz"
          checksum="${archive}.sha256"
          evidence="build/package/evidence/omluke-${RC_VERSION}-${{ matrix.classifier }}.json"
          test -f "$archive"
          test -f "$checksum"
          test -f "$evidence"
          first_sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          recorded_sha="$(awk '{print $1}' "$checksum")"
          test "$first_sha" = "$recorded_sha"
          ./gradlew packageArchive --rerun-tasks
          second_sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$first_sha" = "$second_sha"
      - name: Upload verified platform asset
        uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.classifier }}
          path: |
            build/package/omluke-${{ env.RC_VERSION }}-${{ matrix.classifier }}.tar.gz
            build/package/omluke-${{ env.RC_VERSION }}-${{ matrix.classifier }}.tar.gz.sha256
            build/package/evidence/omluke-${{ env.RC_VERSION }}-${{ matrix.classifier }}.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: publish-*
          path: build/release-input
          merge-multiple: true
      - name: Assemble and verify release bundle
        run: scripts/release/assemble-bundle.sh "$RC_VERSION" build/release-input build/release-bundle
      - name: Ensure tag and release do not exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${RC_VERSION}" >/dev/null 2>&1; then
            echo "Tag already exists: v${RC_VERSION}" >&2
            exit 1
          fi
          if gh release view "v${RC_VERSION}" >/dev/null 2>&1; then
            echo "Release already exists: v${RC_VERSION}" >&2
            exit 1
          fi
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${RC_VERSION}" build/release-bundle/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "Oh My Luke v${RC_VERSION}" \
            --notes-file ".github/release-notes/v${RC_VERSION}.md" \
            --prerelease \
            --latest=false
